<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc">
  <title id="title">Same CRM method, different server-owned provenance</title>
  <desc id="desc">Two otherwise identical tool chains use the same Agent, Run grant, Cases transformation, public operations-case reference kind, and CRM method. The Support-derived Case inherits SUPPORT_FOLLOWUP_ALLOWED and CRM is invoked. The Payment-derived Case inherits PAYMENT_AGGREGATE_ONLY and is denied before CRM. A lower strip distinguishes the enforced typed-reference guarantee, required deployment assumptions, and behavior outside the MVP claim.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .lane-label { font-size: 14px; font-weight: 700; letter-spacing: 1.25px; }
      .node-title { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .section-title { font-size: 16px; font-weight: 700; }
      .node-sub { font-size: 12.5px; fill: #64748b; text-anchor: middle; }
      .edge-label { font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .body { font-size: 13px; fill: #475569; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; filter: url(#shadow); }
      .ref { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; filter: url(#shadow); }
      .allow { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; filter: url(#shadow); }
      .deny { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.2; filter: url(#shadow); }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .allow-edge { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .deny-edge { fill: none; stroke: #dc2626; stroke-width: 2.5; marker-end: url(#arrowRed); }
      .lineage { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1800" height="1020" fill="#ffffff"/>
  <text x="50" y="56" class="title">Same permission and method — different provenance</text>
  <text x="50" y="86" class="subtitle">The model-visible Case references have the same public kind; the Gateway decides from private transitive lineage</text>

  <rect x="50" y="108" width="1700" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="900" y="131" class="node-title">Constant in both paths: same Agent · same immutable RunGrant · same static CRM permission · same Cases tool · same CRM method</text>
  <text x="900" y="151" class="edge-label" fill="#2563eb">Static scope decision = ALLOW</text>

  <!-- Support path -->
  <rect x="50" y="182" width="1700" height="244" rx="18" fill="#f6fffb" stroke="#a7f3d0" stroke-width="1.6"/>
  <text x="72" y="211" class="lane-label" fill="#047857">AUTHORIZED SUPPORT LINEAGE</text>
  <rect x="70" y="235" width="210" height="90" rx="12" class="node"/><text x="175" y="268" class="node-title">support.list_tickets</text><text x="175" y="293" class="node-sub">trusted protected fixture</text><text x="175" y="313" class="node-sub">mints source reference</text>
  <rect x="315" y="235" width="220" height="90" rx="12" class="ref"/><text x="425" y="266" class="node-title">customer_ref_support_1</text><text x="425" y="291" class="node-sub">model-visible opaque handle</text><text x="425" y="312" class="node-sub">kind: customer-subject</text>
  <rect x="570" y="235" width="210" height="90" rx="12" class="node"/><text x="675" y="268" class="node-title">cases.lookup_subject</text><text x="675" y="293" class="node-sub">same intermediate tool</text><text x="675" y="313" class="node-sub">trusted derivation</text>
  <rect x="815" y="235" width="240" height="90" rx="12" class="ref"/><text x="935" y="266" class="node-title">case_ref_1</text><text x="935" y="291" class="node-sub">model-visible public shape</text><text x="935" y="312" class="node-sub">kind: operations-case</text>
  <rect x="1090" y="235" width="245" height="90" rx="12" class="node"/><text x="1212" y="268" class="node-title">crm.resolve_customer</text><text x="1212" y="293" class="node-sub">same statically allowed call</text><text x="1212" y="313" class="node-sub">argument: operations-case</text>
  <rect x="1375" y="225" width="335" height="110" rx="13" class="allow"/><text x="1542" y="258" class="node-title">ALLOW · CRM invoked</text><text x="1542" y="283" class="node-sub">ancestry permits Support follow-up</text><text x="1542" y="305" class="node-sub">trusted CRM counter: 0 → 1</text><text x="1542" y="325" class="node-sub">safe result returned</text>
  <path d="M280 280H315" class="edge"/><path d="M535 280H570" class="edge"/><path d="M780 280H815" class="edge"/><path d="M1055 280H1090" class="edge"/><path d="M1335 280H1375" class="allow-edge"/>
  <path d="M425 325V373H935V325" class="lineage"/>
  <rect x="470" y="350" width="420" height="38" rx="8" fill="#faf8ff" stroke="#ddd6fe"/>
  <text x="680" y="366" class="edge-label" fill="#7c3aed">private Gateway record: parent = support ref</text><text x="680" y="382" class="edge-label" fill="#7c3aed">classification inherited: SUPPORT_FOLLOWUP_ALLOWED</text>

  <!-- Payment path -->
  <rect x="50" y="446" width="1700" height="244" rx="18" fill="#fffafa" stroke="#fecaca" stroke-width="1.6"/>
  <text x="72" y="475" class="lane-label" fill="#b91c1c">FORBIDDEN PAYMENT RE-IDENTIFICATION LINEAGE</text>
  <rect x="70" y="499" width="210" height="90" rx="12" class="node"/><text x="175" y="532" class="node-title">payments.list_failures</text><text x="175" y="557" class="node-sub">trusted protected fixture</text><text x="175" y="577" class="node-sub">mints source reference</text>
  <rect x="315" y="499" width="220" height="90" rx="12" class="ref"/><text x="425" y="530" class="node-title">acct_ref_payment_1</text><text x="425" y="555" class="node-sub">model-visible opaque handle</text><text x="425" y="576" class="node-sub">kind: customer-subject</text>
  <rect x="570" y="499" width="210" height="90" rx="12" class="node"/><text x="675" y="532" class="node-title">cases.lookup_subject</text><text x="675" y="557" class="node-sub">same intermediate tool</text><text x="675" y="577" class="node-sub">trusted derivation</text>
  <rect x="815" y="499" width="240" height="90" rx="12" class="ref"/><text x="935" y="530" class="node-title">case_ref_2</text><text x="935" y="555" class="node-sub">same model-visible shape</text><text x="935" y="576" class="node-sub">kind: operations-case</text>
  <rect x="1090" y="499" width="245" height="90" rx="12" class="node"/><text x="1212" y="532" class="node-title">crm.resolve_customer</text><text x="1212" y="557" class="node-sub">same statically allowed call</text><text x="1212" y="577" class="node-sub">argument: operations-case</text>
  <rect x="1375" y="489" width="335" height="110" rx="13" class="deny"/><text x="1542" y="522" class="node-title">DENY · CRM not invoked</text><text x="1542" y="547" class="node-sub">NO_PAYMENT_REIDENTIFICATION</text><text x="1542" y="569" class="node-sub">trusted CRM counter stays 1</text><text x="1542" y="589" class="node-sub">safe aggregate alternative returned</text>
  <path d="M280 544H315" class="edge"/><path d="M535 544H570" class="edge"/><path d="M780 544H815" class="edge"/><path d="M1055 544H1090" class="edge"/><path d="M1335 544H1375" class="deny-edge"/>
  <path d="M425 589V637H935V589" class="lineage"/>
  <rect x="470" y="614" width="420" height="38" rx="8" fill="#faf8ff" stroke="#ddd6fe"/>
  <text x="680" y="630" class="edge-label" fill="#7c3aed">private Gateway record: parent = payment ref</text><text x="680" y="646" class="edge-label" fill="#7c3aed">classification inherited: PAYMENT_AGGREGATE_ONLY</text>

  <!-- Claim boundary -->
  <text x="50" y="730" class="lane-label" fill="#475569">SECURITY CLAIM BOUNDARY</text>
  <rect x="50" y="750" width="535" height="210" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="75" y="783" class="section-title">Enforced when boundary conditions hold</text>
  <text x="75" y="814" class="body">• Schema-declared protected reference fields</text><text x="75" y="840" class="body">• Capability-derived Run and policy context</text><text x="75" y="866" class="body">• Known, active, correct-kind, same-context lookup</text><text x="75" y="892" class="body">• Transitive parent lineage and pinned flow policy</text><text x="75" y="918" class="body">• Denial before protected fixture invocation</text><text x="75" y="944" class="body">• Lineage continuity across recognized retries</text>
  <rect x="632" y="750" width="535" height="210" rx="16" fill="#fffaf0" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="657" y="783" class="section-title">Required deployment assumptions</text>
  <text x="657" y="814" class="body">• Gateway is the only protected route and credential holder</text><text x="657" y="840" class="body">• Only trusted fixtures mint or derive references</text><text x="657" y="866" class="body">• One shared serialized JSON Store for the P0</text><text x="657" y="892" class="body">• Unknown handles and metadata fail closed</text><text x="657" y="918" class="body">• Pinned Codex 0.111.0 MCP path passes the spike</text><text x="657" y="944" class="body">• Network/configuration prevents a fixture bypass</text>
  <rect x="1215" y="750" width="535" height="210" rx="16" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="1240" y="783" class="section-title">Outside the MVP claim</text>
  <text x="1240" y="814" class="body">• Arbitrary raw strings, free text, files or shell output</text><text x="1240" y="840" class="body">• Unprotected network destinations or third-party MCP</text><text x="1240" y="866" class="body">• Active-Runtime bearer-token theft or exfiltration</text><text x="1240" y="892" class="body">• Duplicate effects, exactly-once execution or replay</text><text x="1240" y="918" class="body">• Production identity or general semantic DLP</text><text x="1240" y="944" class="body">• Tamper-proof or multi-process audit guarantees</text>
  <text x="900" y="992" class="edge-label">Opacity hides the trusted mapping from the model; exclusive Gateway routing and server-side validation create the security boundary.</text>
</svg>
