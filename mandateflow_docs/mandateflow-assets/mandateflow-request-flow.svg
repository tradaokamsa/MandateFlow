<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1080" viewBox="0 0 2000 1080" role="img" aria-labelledby="title desc">
  <title id="title">MandateFlow protected MCP request decision flow</title>
  <desc id="desc">Every MCP initialize, list and call request is authenticated. An invalid capability receives a generic HTTP 401 with no normal policy receipt. Authenticated calls load an immutable Run grant and server-owned references, then pass static scope, reference-validity and provenance-flow checks. Allowed calls run an embedded protected fixture inside a SQLite transaction and atomically commit the result, receipt, counters and derived lineage before returning. Authenticated denials return stage-specific MCP errors and never invoke the fixture.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .zone-label { font-size: 14px; font-weight: 700; letter-spacing: 1.25px; }
      .node-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 12px; fill: #64748b; text-anchor: middle; }
      .edge-label { font-size: 11.5px; font-weight: 700; fill: #475569; text-anchor: middle; }
      .runtime { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
      .policy { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; filter: url(#shadow); }
      .decision { fill: #f8fafc; stroke: #2563eb; stroke-width: 2.1; filter: url(#shadow); }
      .deny { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.1; filter: url(#shadow); }
      .allow { fill: #ecfdf5; stroke: #059669; stroke-width: 2.1; filter: url(#shadow); }
      .fixture { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; filter: url(#shadow); }
      .blue-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .red-edge { fill: none; stroke: #dc2626; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .green-edge { fill: none; stroke: #059669; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .receipt-edge { fill: none; stroke: #059669; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="2000" height="1080" fill="#ffffff"/>
  <text x="50" y="56" class="title">Protected MCP request decision flow</text>
  <text x="50" y="86" class="subtitle">Authentication, immutable authority, typed-reference validity, pinned flow policy, and persisted admission all precede protected execution</text>

  <rect x="30" y="120" width="270" height="810" rx="18" fill="#fffaf5" stroke="#fdba74" stroke-width="1.8"/>
  <text x="52" y="151" class="zone-label" fill="#c2410c">UNTRUSTED CODEX RUNTIME</text>
  <rect x="330" y="120" width="1320" height="810" rx="18" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="352" y="151" class="zone-label" fill="#1d4ed8">TRUSTED STREAMABLE HTTP MCP GATEWAY + SHARED POLICY STORE</text>
  <rect x="1680" y="120" width="290" height="810" rx="18" fill="#faf8ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="1702" y="151" class="zone-label" fill="#6d28d9">PROTECTED FIXTURE</text>

  <!-- Main authenticated request path -->
  <path d="M270 240H350" class="blue-edge"/><path d="M540 240H575" class="blue-edge"/><path d="M775 240H795" class="blue-edge"/><path d="M965 240H1000" class="blue-edge"/><path d="M1200 240H1215" class="blue-edge"/><path d="M1455 240H1465" class="blue-edge"/><path d="M1630 240H1710" class="green-edge"/>

  <rect x="60" y="185" width="210" height="110" rx="13" class="runtime"/>
  <text x="165" y="217" class="node-title">MCP request</text><text x="165" y="241" class="node-sub">initialize · tools/list · tools/call</text><text x="165" y="263" class="node-sub">Bearer Run capability</text><text x="165" y="283" class="node-sub">model-supplied arguments untrusted</text>

  <rect x="350" y="180" width="190" height="120" rx="13" class="policy"/>
  <text x="445" y="211" class="node-title">Authenticate first</text><text x="445" y="235" class="node-sub">hash bearer · verify audience</text><text x="445" y="256" class="node-sub">active capability + Run</text><text x="445" y="277" class="node-sub">derive runId + runGrantId</text>

  <rect x="575" y="180" width="200" height="120" rx="13" class="policy"/>
  <text x="675" y="211" class="node-title">Load trusted state</text><text x="675" y="235" class="node-sub">immutable RunGrant + mandate</text><text x="675" y="256" class="node-sub">pinned purpose + policy version</text><text x="675" y="277" class="node-sub">reference records + ancestry</text>

  <polygon points="880,175 965,240 880,305 795,240" class="decision"/>
  <text x="880" y="222" class="node-title">Static scope</text><text x="880" y="244" class="node-sub">tool · action</text><text x="880" y="264" class="node-sub">resource allowed?</text>

  <polygon points="1100,170 1200,240 1100,310 1000,240" class="decision"/>
  <text x="1100" y="213" class="node-title">References valid?</text><text x="1100" y="236" class="node-sub">known · active · right kind</text><text x="1100" y="257" class="node-sub">same policy context?</text>

  <polygon points="1335,165 1455,240 1335,315 1215,240" class="decision"/>
  <text x="1335" y="210" class="node-title">Flow policy</text><text x="1335" y="233" class="node-sub">walk stored parent ancestry</text><text x="1335" y="254" class="node-sub">allowed for pinned purpose?</text><text x="1335" y="275" class="node-sub">deny-first rule set</text>

  <rect x="1465" y="180" width="165" height="120" rx="13" class="allow"/>
  <text x="1547" y="210" class="node-title">Begin transaction</text><text x="1547" y="234" class="node-sub">decision = ALLOW</text><text x="1547" y="255" class="node-sub">no result disclosed</text><text x="1547" y="276" class="node-sub">before fixture call</text>

  <rect x="1710" y="180" width="220" height="120" rx="13" class="fixture"/>
  <text x="1820" y="212" class="node-title">Execute protected fixture</text><text x="1820" y="237" class="node-sub">Support · Payments · Cases · CRM</text><text x="1820" y="259" class="node-sub">trusted internal target mapping</text><text x="1820" y="280" class="node-sub">invoked only after admission</text>

  <text x="982" y="224" class="edge-label" fill="#059669">YES</text><text x="1208" y="224" class="edge-label" fill="#059669">YES</text><text x="1460" y="224" class="edge-label" fill="#059669">YES</text><text x="1668" y="224" class="edge-label" fill="#059669">ADMITTED</text>

  <!-- Authentication failure: deliberately separate from policy receipts -->
  <path d="M445 300V380" class="red-edge"/>
  <rect x="350" y="380" width="260" height="105" rx="13" class="deny"/>
  <text x="480" y="413" class="node-title">HTTP 401 · invalid_token</text><text x="480" y="438" class="node-sub">generic Bearer failure</text><text x="480" y="459" class="node-sub">no policy detail · no normal receipt</text><text x="480" y="479" class="node-sub">fixture never invoked</text>
  <path d="M350 432H270" class="red-edge"/>
  <rect x="345" y="505" width="270" height="112" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="480" y="532" class="node-title">Authenticated protocol surface</text><text x="480" y="556" class="node-sub">check every initialize · list · call</text><text x="480" y="577" class="node-sub">bind MCP session to same Run</text><text x="480" y="598" class="node-sub">filter tools/list by immutable grant</text>
  <rect x="337" y="330" width="286" height="28" rx="7" fill="#ffffff"/><text x="480" y="349" class="edge-label" fill="#dc2626">missing · malformed · unknown · expired · terminal · wrong audience</text>

  <!-- Authenticated denial branches -->
  <path d="M880 305V342H820V370" class="red-edge"/><path d="M1100 310V370" class="red-edge"/><path d="M1335 315V365" class="red-edge"/>
  <rect x="720" y="370" width="200" height="90" rx="12" class="deny"/>
  <text x="820" y="404" class="node-title">SCOPE_DENIED</text><text x="820" y="429" class="node-sub">tool/action/resource</text><text x="820" y="450" class="node-sub">outside immutable grant</text>
  <rect x="960" y="370" width="240" height="90" rx="12" class="deny"/>
  <text x="1080" y="404" class="node-title">INVALID_REFERENCE</text><text x="1080" y="429" class="node-sub">one non-oracle response for</text><text x="1080" y="450" class="node-sub">unknown · expired · wrong kind/context</text>
  <rect x="1230" y="365" width="240" height="100" rx="12" class="deny"/>
  <text x="1350" y="397" class="node-title">FLOW_DENIED</text><text x="1350" y="422" class="node-sub">safe rule ID + receipt ID</text><text x="1350" y="443" class="node-sub">alternative only when present</text><text x="1350" y="461" class="node-sub">in this same RunGrant</text>
  <text x="836" y="343" class="edge-label" fill="#dc2626">NO</text><text x="1115" y="347" class="edge-label" fill="#dc2626">NO</text><text x="1350" y="344" class="edge-label" fill="#dc2626">NO</text>

  <path d="M820 460V500H975V535" class="red-edge"/><path d="M1080 460V535" class="red-edge"/><path d="M1350 465V500H1135V535" class="red-edge"/>
  <rect x="915" y="535" width="280" height="110" rx="13" class="deny"/>
  <text x="1055" y="568" class="node-title">Persist redacted DENY receipt</text><text x="1055" y="593" class="node-sub">static decision · provenance decision</text><text x="1055" y="614" class="node-sub">PRE_EXECUTION · NOT_INVOKED</text><text x="1055" y="635" class="node-sub">downstreamInvoked = false</text>
  <path d="M915 590H840V760" class="red-edge"/>
  <rect x="590" y="760" width="280" height="110" rx="13" class="deny"/>
  <text x="730" y="793" class="node-title">Authenticated MCP tool error</text><text x="730" y="818" class="node-sub">stage-specific safe code + receipt ID</text><text x="730" y="839" class="node-sub">no raw identifier or policy state</text><text x="730" y="860" class="node-sub">Codex may recover and continue</text>
  <path d="M590 815H270" class="red-edge"/>

  <!-- Allowed fixture result, outcome and lineage -->
  <path d="M1820 300V558H1650" class="green-edge"/>
  <rect x="1390" y="500" width="260" height="130" rx="13" class="allow"/>
  <text x="1520" y="531" class="node-title">Commit result before return</text><text x="1520" y="555" class="node-sub">fixture + receipt + counter</text><text x="1520" y="576" class="node-sub">mint opaque typed references</text><text x="1520" y="597" class="node-sub">parents + inherited classifications</text><text x="1520" y="618" class="node-sub">producing receipt + internal mapping</text>
  <path d="M1390 565H1330V690" class="green-edge"/>
  <rect x="1110" y="690" width="240" height="100" rx="13" class="allow"/>
  <text x="1230" y="723" class="node-title">Return safe MCP result</text><text x="1230" y="748" class="node-sub">opaque typed references only</text><text x="1230" y="769" class="node-sub">or downstream failure result</text>
  <path d="M1110 740H270" class="green-edge"/>

  <rect x="1697" y="835" width="256" height="48" rx="8" fill="#fff1f2" stroke="#fecaca"/>
  <text x="1825" y="856" class="edge-label" fill="#dc2626">Every red branch stops before entry</text><text x="1825" y="875" class="edge-label" fill="#dc2626">to this protected zone</text>

  <rect x="330" y="960" width="620" height="52" rx="9" fill="#fff1f2" stroke="#fecaca"/>
  <text x="640" y="981" class="edge-label" fill="#dc2626">Gateway unavailable → fail closed; required protected tools have no direct fallback</text><text x="640" y="1001" class="edge-label" fill="#dc2626">Runtime has neither a protected-fixture route nor downstream credentials</text>
  <rect x="985" y="960" width="665" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1317" y="981" class="edge-label">Malformed JSON-RPC or MCP → protocol error, not a semantic policy denial</text><text x="1317" y="1001" class="edge-label">Unknown direct tools/call still checks the immutable grant and fails closed</text>
</svg>
