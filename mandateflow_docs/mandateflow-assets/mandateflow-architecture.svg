<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">MandateFlow integration architecture</title>
  <desc id="desc">The Agent Launchpad baseline remains intact from the browser through Fastify, AgentService, AgentRunner, Codex and Volcengine Ark. MandateFlow integrates at three starter-kit seams. Codex connects separately to a trusted Go Streamable HTTP MCP Gateway, which is the only path to protected Support, Payments, Cases and CRM fixtures. Node keeps baseline JSON metadata while Go exclusively owns SQLite authority, reference-lineage and receipt records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .zone-label { font-size: 14px; font-weight: 700; letter-spacing: 1.35px; }
      .node-title { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 12.5px; fill: #64748b; text-anchor: middle; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .legend { font-size: 12px; fill: #475569; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; filter: url(#shadow); }
      .middleware { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; filter: url(#shadow); }
      .gateway { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.4; filter: url(#shadow); }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; filter: url(#shadow); }
      .runtime { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
      .external { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; filter: url(#shadow); }
      .baseline-edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .integration-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowBlue); }
      .protected-edge { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrowRed); }
      .return-edge { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .state-edge { fill: none; stroke: #059669; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="50" y="56" class="title">MandateFlow integration architecture</text>
  <text x="50" y="86" class="subtitle">One cross-cutting control plane; one exclusive protected MCP data path; Ark inference remains unchanged</text>

  <g transform="translate(1050 46)">
    <line x1="0" y1="0" x2="45" y2="0" class="baseline-edge"/><text x="55" y="5" class="legend">baseline</text>
    <line x1="132" y1="0" x2="177" y2="0" class="integration-edge"/><text x="187" y="5" class="legend">integration seam</text>
    <line x1="310" y1="0" x2="355" y2="0" class="protected-edge"/><text x="365" y="5" class="legend">protected request</text>
    <line x1="505" y1="0" x2="550" y2="0" class="return-edge"/><text x="560" y="5" class="legend">safe return</text>
  </g>

  <rect x="28" y="112" width="328" height="940" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="143" class="zone-label" fill="#475569">EXPERIENCE</text>
  <rect x="380" y="112" width="690" height="940" rx="18" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="402" y="143" class="zone-label" fill="#1d4ed8">TRUSTED LAUNCHPAD HOST</text>
  <rect x="1095" y="112" width="310" height="940" rx="18" fill="#fffaf5" stroke="#fdba74" stroke-width="1.8"/>
  <text x="1117" y="143" class="zone-label" fill="#c2410c">UNTRUSTED RUNTIME</text>
  <rect x="1430" y="112" width="342" height="940" rx="18" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1452" y="143" class="zone-label" fill="#475569">EXTERNAL MODEL SERVICE</text>

  <path d="M174 230H210" class="baseline-edge"/><path d="M342 230H410" class="baseline-edge"/><path d="M590 230H630" class="baseline-edge"/><path d="M820 230H855" class="baseline-edge"/><path d="M1025 230H1125" class="baseline-edge"/><path d="M1375 230H1480" class="baseline-edge"/>
  <path d="M725 275V330H620" class="baseline-edge"/><path d="M770 275V305H925V330" class="baseline-edge"/>

  <rect x="50" y="185" width="124" height="90" rx="12" class="node"/><text x="112" y="220" class="node-title">Human</text><text x="112" y="244" class="node-sub">operator</text>
  <rect x="210" y="185" width="132" height="90" rx="12" class="node"/><text x="276" y="220" class="node-title">React UI</text><text x="276" y="244" class="node-sub">Playground</text>
  <rect x="410" y="185" width="180" height="90" rx="12" class="node"/><text x="500" y="219" class="node-title">Fastify API</text><text x="500" y="243" class="node-sub">control + evidence</text>
  <rect x="630" y="185" width="190" height="90" rx="12" class="node"/><text x="725" y="219" class="node-title">AgentService</text><text x="725" y="243" class="node-sub">Run lifecycle</text>
  <rect x="855" y="185" width="170" height="90" rx="12" class="node"/><text x="940" y="219" class="node-title">AgentRunner</text><text x="940" y="243" class="node-sub">process/container boundary</text>
  <rect x="1125" y="180" width="250" height="100" rx="12" class="runtime"/><text x="1250" y="214" class="node-title">Codex CLI</text><text x="1250" y="238" class="node-sub">disposable Runtime per Run</text><text x="1250" y="259" class="node-sub">reasoning remains untrusted</text>
  <rect x="1480" y="185" width="230" height="90" rx="12" class="external"/><text x="1595" y="219" class="node-title">Volcengine Ark</text><text x="1595" y="243" class="node-sub">Responses API</text>
  <rect x="1452" y="292" width="286" height="30" rx="7" fill="#ffffff"/><text x="1595" y="312" class="edge-label">existing inference path — unchanged</text>

  <rect x="430" y="330" width="370" height="118" rx="13" class="store"/>
  <text x="615" y="360" class="node-title">Go-owned SQLite</text><text x="615" y="384" class="node-sub">contexts · immutable Run grants · retry links</text><text x="615" y="405" class="node-sub">capability digests · protected reference mappings</text><text x="615" y="426" class="node-sub">transitive lineage · counters · safe receipts</text>
  <rect x="835" y="330" width="190" height="118" rx="13" class="node"/><text x="930" y="372" class="node-title">Workspace</text><text x="930" y="398" class="node-sub">per Agent</text><text x="930" y="419" class="node-sub">untrusted content</text>

  <text x="402" y="500" class="zone-label" fill="#1d4ed8">TEAM-DESIGNED MIDDLEWARE — MANDATEFLOW</text><line x1="402" y1="514" x2="1045" y2="514" stroke="#bfdbfe" stroke-width="2"/>
  <path d="M500 275V300H397V590H420" class="integration-edge"/><path d="M700 275V305H815V520H650V535" class="integration-edge"/><path d="M940 275V305H1045V590H1030" class="integration-edge"/>
  <rect x="432" y="465" width="136" height="25" rx="6" fill="#ffffff"/><text x="500" y="482" class="edge-label">receipts + retry</text>
  <rect x="600" y="452" width="185" height="25" rx="6" fill="#ffffff"/><text x="692" y="469" class="edge-label">context + immutable grant</text>
  <rect x="855" y="465" width="170" height="25" rx="6" fill="#ffffff"/><text x="940" y="482" class="edge-label">Run bootstrap seam</text>

  <rect x="420" y="535" width="280" height="110" rx="13" class="middleware"/>
  <text x="560" y="568" class="node-title">Go authority lifecycle service</text><text x="560" y="593" class="node-sub">create context · derive no-broader grant</text><text x="560" y="614" class="node-sub">bind capability digest · terminalize</text>
  <rect x="770" y="535" width="260" height="110" rx="13" class="middleware"/>
  <text x="900" y="568" class="node-title">Runner bootstrap integration</text><text x="900" y="593" class="node-sub">Gateway URL + bearer env-var name</text><text x="900" y="614" class="node-sub">token only in per-Run spawn environment</text>
  <rect x="420" y="705" width="280" height="120" rx="13" class="middleware"/>
  <text x="560" y="740" class="node-title">Pinned deterministic flow policy</text><text x="560" y="765" class="node-sub">purpose + version · deny-first rules</text><text x="560" y="786" class="node-sub">static scope + stored ancestry</text><text x="560" y="807" class="node-sub">no model-supplied provenance</text>
  <rect x="770" y="680" width="260" height="170" rx="13" class="gateway"/>
  <text x="900" y="714" class="node-title">Go Streamable HTTP MCP Gateway</text><text x="900" y="739" class="node-sub">authenticate initialize · list · call</text><text x="900" y="760" class="node-sub">active grant · tool/action/resource</text><text x="900" y="781" class="node-sub">reference kind · context · status</text><text x="900" y="802" class="node-sub">walk ancestry · apply pinned policy</text><text x="900" y="823" class="node-sub">commit fixture + evidence before disclosure</text>
  <rect x="770" y="895" width="260" height="120" rx="13" class="node"/>
  <text x="900" y="930" class="node-title">Protected fixtures</text><text x="900" y="955" class="node-sub">Support · Payments · Cases · CRM</text><text x="900" y="976" class="node-sub">trusted minting + internal mappings</text><text x="900" y="997" class="node-sub">invocation counters prove non-disclosure</text>

  <path d="M560 535V448" class="state-edge"/><path d="M770 735H742V448" class="integration-edge"/><path d="M742 448V790H770" class="state-edge"/><path d="M770 765H700" class="integration-edge"/>
  <rect x="604" y="651" width="176" height="25" rx="6" fill="#ffffff"/><text x="692" y="668" class="edge-label">load grant + lineage</text>
  <rect x="606" y="843" width="178" height="25" rx="6" fill="#ffffff"/><text x="695" y="860" class="edge-label">persist facts + receipts</text>

  <path d="M1030 590H1080V320H1198V280" class="integration-edge"/>
  <rect x="1055" y="473" width="315" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe"/><text x="1212" y="493" class="edge-label" fill="#2563eb">Gateway URL + named bearer environment</text><text x="1212" y="511" class="edge-label" fill="#2563eb">no capability value in argv or config</text>
  <path d="M1220 280V730H1040V755H1030" class="protected-edge"/><path d="M1030 815H1065V330H1280V280" class="return-edge"/>
  <rect x="1080" y="540" width="310" height="55" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="1235" y="562" class="edge-label" fill="#dc2626">MCP request + bearer capability</text><text x="1235" y="582" class="edge-label" fill="#059669">safe result · MCP error · generic HTTP 401</text>
  <path d="M870 850V895" class="protected-edge"/><path d="M930 895V850" class="return-edge"/>
  <rect x="710" y="862" width="380" height="25" rx="6" fill="#ffffff"/><text x="900" y="879" class="edge-label">invoke only after admission · trusted result returns to Gateway</text>

  <rect x="430" y="1022" width="940" height="32" rx="8" fill="#fff1f2" stroke="#fecaca"/><text x="900" y="1043" class="edge-label" fill="#dc2626">Runtime has no direct fixture route or downstream credential — the Gateway is the only protected-service path</text>
</svg>
